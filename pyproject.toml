[project]
name = "valkit"
version = "0.1.0"
description = "Personal day-to-day utility scripts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [
    { name = "Val", email = "valzav@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "mail-parser-reply>=1.36",
    "markdownify>=1.2.3",
    "mnemonic>=0.21",
    "phonenumbers>=9.0.40",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
email-extractor = "valkit.email_extractor.cli:main"
mac-apps = "valkit.mac_apps.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
